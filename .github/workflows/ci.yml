name: ci

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: verify
        run: |
          bash -n repos
          shellcheck -S warning repos test/stub/fzf/fzf test/stub/git/git

      - name: test
        run: bats test/repos.bats
