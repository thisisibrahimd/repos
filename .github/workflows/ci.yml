name: ci

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup mise (bats, usage)
        uses: jdx/mise-action@v2 # installs tools from mise.toml, adds them to PATH

      - name: docs are fresh
        run: |
          usage lint repos.usage.kdl
          usage generate markdown --file repos.usage.kdl --out-file docs/reference.md
          git diff --exit-code docs/reference.md

      - name: verify
        run: |
          bash -n repos
          shellcheck -S warning repos test/stub/fzf/fzf test/stub/git/git

      - name: test
        run: bats test/repos.bats
