name: ci

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: verify
        run: |
          bash -n repos
          shellcheck -S warning repos test/stub/fzf/fzf test/stub/git/git

      - name: test
        run: bats test/repos.bats
